[build]
builder = "NIXPACKS"
buildCommand = "npm install --prefix backend --legacy-peer-deps && NODE_ENV=development npm install --prefix frontend --legacy-peer-deps && npm run build --prefix frontend && cd backend && npx prisma generate"

[deploy]
startCommand = "node backend/src/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
