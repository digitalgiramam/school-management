[build]
builder = "NIXPACKS"
buildCommand = "npm ci --prefix backend && npm install --prefix frontend && npm run build --prefix frontend && npx --prefix backend prisma generate"

[deploy]
startCommand = "node backend/src/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
